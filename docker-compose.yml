version: '3.8'
services:
  forge:
    build: .
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql://forge:forge@db:5432/forge
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
volumes:
  pgdata:
